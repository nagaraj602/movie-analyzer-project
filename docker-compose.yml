services:
  database:
    image: postgres:17-alpine
    container_name: movie-analyzer-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5438:5432"
    volumes:
      - ./database_scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  model:
    image: movie-analyzer-model:latest
    build:
      context: ../project-movie-analyzer-model
      dockerfile: Dockerfile
    container_name: movie-analyzer-model
    restart: unless-stopped
    ports:
      - "7380:7380"
    environment:
      MODEL_PORT: "7380"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7380/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  backend:
    image: movie-analyzer-backend:latest
    build:
      context: ../project-movie-analyzer-backend
      dockerfile: Dockerfile
    container_name: movie-analyzer-backend
    restart: unless-stopped
    ports:
      - "7280:7280"
    environment:
      SERVER_PORT: "7280"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_NAME: "moviereviews"
      DB_USERNAME: "movieuser"
      DB_PASSWORD: "moviepass"
      MODEL_SERVER_URL: "http://model:7380"
    depends_on:
      database:
        condition: service_healthy
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7280/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - movie-network

  frontend:
    image: movie-analyzer-frontend:latest
    build:
      context: ../project-movie-analyzer-frontend
      dockerfile: Dockerfile
    container_name: movie-analyzer-frontend
    restart: unless-stopped
    ports:
      - "7180:7180"
    environment:
      PORT: "7180"
      BACKEND_API_URL: "http://backend:7280"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); http.get('http://localhost:7180/health', res => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

volumes:
  postgres_data:

networks:
  movie-network:
    driver: bridge
